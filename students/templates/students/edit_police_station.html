{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/static/images/icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Police Station – ITD Martial Arts Academy (Kadappadi)</title>
  <link rel="apple-touch-icon" href="/static/images/icon.png">
  <meta name="theme-color" content="#1A1A1A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #C0392B;
      --red-dark: #922B21;
      --red-light: #FADBD8;
      --gold: #D4AC0D;
      --gold-light: #FEF9E7;
      --black: #1A1A1A;
      --surface: #FFFFFF;
      --bg: #F7F5F0;
      --border: #E8E2D9;
      --text-main: #1A1A1A;
      --text-muted: #7B7166;
      --radius: 14px;
      --shadow: 0 2px 16px rgba(0,0,0,0.07);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* ── Header ── */
    .site-header {
      background: var(--black);
      padding: 0 1.25rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .belt-icon { width: 32px; height: 32px; }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.04em;
    }

    .brand-title span { color: var(--gold); }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      color: #AAAAAA;
      background: none;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 14px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .back-btn svg { width: 14px; height: 14px; }
    .back-btn:hover { color: #fff; border-color: #666; }

    .logout-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      color: #AAAAAA;
      background: none;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .logout-btn:hover { color: #fff; border-color: #666; }

    /* ── Page body ── */
    .page-body {
      padding: 1.75rem 1.25rem 3rem;
      max-width: 560px;
      margin: 0 auto;
    }

    /* ── Page title ── */
    .page-title {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 1.75rem;
    }

    .page-title-icon {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      background: var(--red-light);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid #F09595;
    }

    .page-title-icon svg { width: 24px; height: 24px; }

    .page-title h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .page-title p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* ── Form card ── */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .form-card-top {
      height: 4px;
      background: var(--red);
    }

    .form-card-body {
      padding: 1.5rem 1.5rem 1.75rem;
    }

    .form-section-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Django form fields ── */
    .django-form p {
      margin-bottom: 1.15rem;
    }

    .django-form p:last-of-type { margin-bottom: 0; }

    .django-form p label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .django-form p input[type="text"],
    .django-form p input[type="number"],
    .django-form p input[type="checkbox"],
    .django-form p select,
    .django-form p textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .django-form p input[type="checkbox"] {
      width: auto;
      margin-top: 5px;
    }

    .django-form p input:focus,
    .django-form p select:focus,
    .django-form p textarea:focus {
      border-color: var(--red);
      background: #fff;
    }

    .django-form .errorlist {
      list-style: none;
      margin: 5px 0 0;
      padding: 0;
    }

    .django-form .errorlist li {
      font-size: 0.78rem;
      color: var(--red);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .django-form .errorlist li::before {
      content: '';
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
    }

    /* ── Divider ── */
    .form-divider {
      height: 1px;
      background: var(--border);
      margin: 1.5rem 0;
    }

    /* ── Actions ── */
    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 1.5rem;
    }

    .btn-save {
      flex: 1;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-save svg { width: 17px; height: 17px; }
    .btn-save:hover { background: var(--red-dark); }
    .btn-save:active { transform: scale(0.99); }

    .btn-cancel {
      background: none;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 20px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-cancel:hover {
      background: var(--bg);
      color: var(--text-main);
    }

    /* ── Responsive ── */
    @media (min-width: 600px) {
      .site-header { padding: 0 2rem; }
      .page-body { padding: 2rem 2rem 3rem; }
    }

    @media (min-width: 960px) {
      .page-body { padding: 2.5rem 2rem 3rem; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <a href="/" class="brand">
      <img src="/static/images/icon.png" class="belt-icon" alt="Logo" style="object-fit: contain; border-radius: 6px; box-shadow: 0 2px 8px rgba(212, 172, 13, 0.45);">
      <span class="brand-title">ITD Martial Arts <span>Academy (Kadappadi)</span></span>
    </a>
    <div style="display: flex; align-items: center; gap: 10px;">
      <a href="/police-stations/" class="back-btn">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M9 2L4 7l5 5"/>
        </svg>
        Back
      </a>
      <form method="POST" action="/logout/" onsubmit="return confirm('Logout?')" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="logout-btn">Logout</button>
      </form>
    </div>
  </header>

  <!-- Page body -->
  <div class="page-body">

    <!-- Page title -->
    <div class="page-title">
      <div class="page-title-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div>
        <h2>Edit Police Station</h2>
        <p>Modify station configuration details</p>
      </div>
    </div>

    <!-- Form card -->
    <div class="form-card">
      <div class="form-card-top"></div>
      <div class="form-card-body">

        <p class="form-section-label">Station Details</p>

        <form method="POST" class="django-form">
          {% csrf_token %}
          {{ form.as_p }}

          <div class="form-divider"></div>

          <div class="form-actions">
            <a href="/police-stations/" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-save">
              <svg viewBox="0 0 17 17" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l4 4 7-7"/>
              </svg>
              Update Station
            </button>
          </div>
        </form>

      </div>
    </div>

  </div>

</body>
</html>
